<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="Helvetica, Arial, sans-serif">
  <title>How it connects: a PC talks to a Motorola radio through a Glasgow, with no RIB</title>
  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .ink { fill: #1f2328; }
    .muted { fill: #59636e; }
    .card { fill: #f6f8fa; stroke: #d0d7de; }
    .glasgow { fill: #eef3fb; stroke: #2a4d8f; }
    .gtext { fill: #2a4d8f; }
    .radio { fill: #2d2d2d; stroke: #111111; }
    .rtext { fill: #f0f0f0; }
    .usb { stroke: #2a4d8f; }
    .bus { stroke: #d1242f; }
    .bustext { fill: #d1242f; }
    .gnd { stroke: #1f2328; }
    .hook { stroke: #1a7f37; }
    .hooktext { fill: #1a7f37; }
    .psu { fill: #dafbe1; stroke: #1a7f37; }
    .dot { fill: #1f2328; }
    .hookdot { fill: #1a7f37; }
    .screen { fill: #1f2328; }
    .term { fill: #3fb950; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .ink { fill: #e6edf3; }
      .muted { fill: #9198a1; }
      .card { fill: #161b22; stroke: #30363d; }
      .glasgow { fill: #10223f; stroke: #6c9ce6; }
      .gtext { fill: #8fb5ef; }
      .radio { fill: #2d2d2d; stroke: #8b949e; }
      .usb { stroke: #6c9ce6; }
      .bus { stroke: #ff7b72; }
      .bustext { fill: #ff7b72; }
      .gnd { stroke: #c9d1d9; }
      .hook { stroke: #3fb950; }
      .hooktext { fill: #3fb950; }
      .psu { fill: #0f2a19; stroke: #3fb950; }
      .dot { fill: #c9d1d9; }
      .hookdot { fill: #3fb950; }
      .screen { fill: #010409; }
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="959" height="359" rx="16"/>

  <text class="ink" x="40" y="58" font-size="20" font-weight="bold">How it connects</text>
  <text class="muted" x="40" y="84" font-size="14">USB on one side, three wires on the other. All the bus timing happens inside the Glasgow.</text>

  <!-- PC -->
  <rect class="card" x="40" y="130" width="190" height="130" rx="10" stroke-width="2"/>
  <rect class="screen" x="62" y="148" width="146" height="72" rx="4"/>
  <text class="term" x="72" y="170" font-size="11" font-family="Menlo, Consolas, monospace">&gt; F1 10 FE</text>
  <text class="term" x="72" y="188" font-size="11" font-family="Menlo, Consolas, monospace">&lt; F1 10 FE 50</text>
  <text class="term" x="72" y="206" font-size="11" font-family="Menlo, Consolas, monospace">ACK</text>
  <text class="ink" x="135" y="244" font-size="14" font-weight="bold" text-anchor="middle">Your PC</text>
  <text class="muted" x="135" y="282" font-size="12" text-anchor="middle">Python, your own CPS,</text>
  <text class="muted" x="135" y="298" font-size="12" text-anchor="middle">or DPS under an emulator</text>

  <!-- USB -->
  <line class="usb" x1="230" y1="195" x2="350" y2="195" stroke-width="5" stroke-linecap="round"/>
  <text class="gtext" x="290" y="182" font-size="13" font-weight="bold" text-anchor="middle">USB</text>
  <text class="muted" x="290" y="218" font-size="11" text-anchor="middle">pty / socket</text>

  <!-- Glasgow -->
  <rect class="glasgow" x="350" y="130" width="210" height="130" rx="10" stroke-width="2.5"/>
  <text class="gtext" x="455" y="164" font-size="20" font-weight="bold" text-anchor="middle">Glasgow</text>
  <text class="ink" x="455" y="188" font-size="12" text-anchor="middle" font-family="Menlo, Consolas, monospace">glasgow run rib</text>
  <text class="muted" x="455" y="214" font-size="11.5" text-anchor="middle">open-drain UART + echo</text>
  <text class="muted" x="455" y="230" font-size="11.5" text-anchor="middle">bus timing in gateware</text>
  <text class="muted" x="455" y="246" font-size="11.5" text-anchor="middle">5 V I/O, no level shifter</text>

  <!-- wires -->
  <line class="bus" x1="560" y1="170" x2="720" y2="170" stroke-width="4"/>
  <text class="bustext" x="640" y="160" font-size="13" font-weight="bold" text-anchor="middle">BUS+</text>
  <line class="gnd" x1="560" y1="220" x2="720" y2="220" stroke-width="4"/>
  <text class="ink" x="640" y="210" font-size="13" font-weight="bold" text-anchor="middle">GND</text>
  <!-- HOOK supply (GM600) -->
  <rect class="psu" x="578" y="268" width="128" height="64" rx="8" stroke-width="2"/>
  <text class="hooktext" x="642" y="292" font-size="13" font-weight="bold" text-anchor="middle">Bench PSU 9 V</text>
  <text class="muted" x="642" y="309" font-size="11" text-anchor="middle">current limit ~20 mA</text>
  <text class="muted" x="642" y="324" font-size="11" text-anchor="middle">GM600 only</text>
  <line class="gnd" x1="596" y1="268" x2="596" y2="220" stroke-width="2.5"/>
  <circle class="dot" cx="596" cy="220" r="4.5"/>
  <text class="muted" x="588" y="258" font-size="11" text-anchor="end">−</text>
  <polyline class="hook" points="706,300 760,300 760,265" fill="none" stroke-width="3"/>
  <circle class="hookdot" cx="760" cy="265" r="4.5"/>
  <text class="hooktext" x="768" y="292" font-size="12.5" font-weight="bold">+ HOOK (pin 14)</text>
  <text class="muted" x="768" y="308" font-size="11">puts the radio in</text>
  <text class="muted" x="768" y="322" font-size="11">programming mode</text>

  <!-- radio -->
  <rect class="radio" x="720" y="125" width="200" height="140" rx="12" stroke-width="2"/>
  <rect x="738" y="143" width="80" height="26" rx="3" fill="#7ee787" opacity="0.85"/>
  <text x="778" y="161" font-size="12" text-anchor="middle" font-family="Menlo, Consolas, monospace" fill="#0d1117">CH 1</text>
  <circle cx="880" cy="160" r="16" fill="#555" stroke="#888"/>
  <g fill="#888"><rect x="738" y="186" width="18" height="12" rx="2"/><rect x="762" y="186" width="18" height="12" rx="2"/><rect x="786" y="186" width="18" height="12" rx="2"/></g>
  <text class="rtext" x="820" y="232" font-size="15" font-weight="bold" text-anchor="middle">Motorola radio</text>
  <text x="820" y="252" font-size="12" text-anchor="middle" fill="#bbbbbb">GM600, GM300, Maxtrac …</text>
</svg>
