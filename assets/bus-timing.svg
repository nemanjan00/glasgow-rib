<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Helvetica, Arial, sans-serif">
  <title>BUS+ timing: wait for 10 idle bit times, send the burst back to back, read everything back</title>
  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .ink { fill: #1f2328; }
    .muted { fill: #59636e; }
    .wave { stroke: #d1242f; fill: none; }
    .idle { fill: #ddf4ff; }
    .byte { fill: #ffebe9; }
    .grid { stroke: #d0d7de; }
    .echo { stroke: #1a7f37; fill: none; }
    .echotext { fill: #1a7f37; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .ink { fill: #e6edf3; }
      .muted { fill: #9198a1; }
      .wave { stroke: #ff7b72; }
      .idle { fill: #0c2d4a; }
      .byte { fill: #3d1416; }
      .grid { stroke: #30363d; }
      .echo { stroke: #3fb950; }
      .echotext { fill: #3fb950; }
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="759" height="299" rx="16"/>
  <text class="ink" x="40" y="42" font-size="18" font-weight="bold">What the gateware does on BUS+</text>
  <text class="muted" x="40" y="64" font-size="13">Timing lives in the FPGA, not on the far side of USB.</text>

  <!-- regions -->
  <rect class="idle" x="60" y="92" width="200" height="90" rx="4"/>
  <rect class="byte" x="260" y="92" width="150" height="90"/>
  <rect class="byte" x="410" y="92" width="150" height="90" opacity="0.75"/>
  <rect class="byte" x="560" y="92" width="150" height="90"/>

  <!-- levels -->
  <text class="muted" x="40" y="108" font-size="11" text-anchor="end">1</text>
  <text class="muted" x="40" y="172" font-size="11" text-anchor="end">0</text>
  <line class="grid" x1="45" y1="104" x2="720" y2="104" stroke-width="1" stroke-dasharray="2 4"/>
  <line class="grid" x1="45" y1="168" x2="720" y2="168" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- waveform: idle high, then 3 bytes 8N1 back to back (schematic bits), then idle high -->
  <polyline class="wave" stroke-width="2.5" points="
    60,104 260,104
    260,168 275,168 275,104 305,104 305,168 335,168 335,104 365,104 365,168 380,168 380,104 410,104
    410,168 425,168 425,104 440,104 440,168 470,168 470,104 500,104 500,168 545,168 545,104 560,104
    560,168 575,168 575,104 620,104 620,168 650,168 650,104 680,104 680,168 695,168 695,104 710,104
    710,104 720,104"/>

  <!-- labels -->
  <text class="ink" x="160" y="200" font-size="12.5" font-weight="bold" text-anchor="middle">1. wait for 10 idle bit times</text>
  <text class="muted" x="160" y="216" font-size="11.5" text-anchor="middle">line high, BUSY inactive</text>
  <text class="ink" x="485" y="200" font-size="12.5" font-weight="bold" text-anchor="middle">2. one write() = one gap-free burst</text>
  <text class="muted" x="485" y="216" font-size="11.5" text-anchor="middle">8N1, open drain: only ever pulled low</text>

  <!-- echo -->
  <path class="echo" d="M 300 248 L 680 248" stroke-width="2" marker-end="url(#arr)"/>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker></defs>
  <text class="echotext" x="490" y="272" font-size="12.5" font-weight="bold" text-anchor="middle">every byte on the wire goes back to the host, ours included (the echo the radio software expects)</text>
</svg>
