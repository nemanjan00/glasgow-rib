[project]
name = "glasgow-rib"
version = "0.1.0"
description = "Glasgow applet: half-duplex open-drain UART with BUSY line for Motorola SB9600/SBEP radios (RIB replacement)"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
# Glasgow is NOT a PyPI dependency: the `glasgow` name on PyPI is an unrelated placeholder. Install
# Glasgow from git (see README.md); this applet is loaded into that environment. The GM600 host
# tools under gm600/tools/ are pure-Python and need nothing beyond the stdlib.
dependencies = []

[project.entry-points."glasgow.applet"]
rib = "glasgow_rib:RIBApplet"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["glasgow_rib"]
