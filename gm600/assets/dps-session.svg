<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Helvetica, Arial, sans-serif">
<title>DPS read and write sessions with a GM600, as captured through the applet</title>
<style>
  .bg { fill: #ffffff; stroke: #d0d7de; }
  .ink { fill: #1f2328; }
  .muted { fill: #59636e; }
  .line { stroke: #8c959f; fill: none; }
  .bound { fill: #2da44e; }
  .partial { fill: #d4a72c; }
  .readonly { fill: #6e7781; }
  .unknown { fill: #d0d7de; }
  .factory { fill: #cf222e; }
  .cks { fill: #8250df; }
  .host { fill: #ddf4ff; stroke: #0969da; }
  .radio { fill: #f6f8fa; stroke: #6e7781; }
  .tx { stroke: #0969da; }
  .txt { fill: #0969da; }
  .rx { stroke: #1a7f37; }
  .rxt { fill: #1a7f37; }
  .reset { fill: #fff8c5; stroke: #9a6700; }
  .resett { fill: #9a6700; }
  .wr { stroke: #cf222e; }
  .wrt { fill: #cf222e; }
  .sep { stroke: #ffffff; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; stroke: #30363d; }
    .ink { fill: #e6edf3; }
    .muted { fill: #9198a1; }
    .line { stroke: #6e7681; }
    .bound { fill: #3fb950; }
    .partial { fill: #d29922; }
    .readonly { fill: #8b949e; }
    .unknown { fill: #30363d; }
    .factory { fill: #f85149; }
    .cks { fill: #a371f7; }
    .host { fill: #0c2d4a; stroke: #58a6ff; }
    .radio { fill: #161b22; stroke: #8b949e; }
    .tx { stroke: #58a6ff; }
    .txt { fill: #58a6ff; }
    .rx { stroke: #3fb950; }
    .rxt { fill: #3fb950; }
    .reset { fill: #3b2e0a; stroke: #d29922; }
    .resett { fill: #d29922; }
    .wr { stroke: #ff7b72; }
    .wrt { fill: #ff7b72; }
    .sep { stroke: #0d1117; }
  }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="999" height="559" rx="16"/>
<text class="ink" x="40" y="44" font-size="20" font-weight="bold">A DPS session with a GM600, as captured on the wire</text>
<text class="muted" x="40" y="68" font-size="13.5">Every frame is echoed back first (not drawn). ACK is 50. Write = a full read, then the write steps below.</text>
<text class="ink" x="225" y="104" font-size="16" font-weight="bold" text-anchor="middle">Read</text>
<rect class="host" x="40" y="116" width="100" height="32" rx="6" stroke-width="1.5"/>
<text class="txt" x="90" y="137" font-size="13" font-weight="bold" text-anchor="middle">Host / DPS</text>
<rect class="radio" x="310" y="116" width="100" height="32" rx="6" stroke-width="1.5"/>
<text class="ink" x="360" y="137" font-size="13" font-weight="bold" text-anchor="middle">GM600</text>
<line class="line" x1="90" y1="148" x2="90" y2="530" stroke-width="1.2" stroke-dasharray="4 4"/>
<line class="line" x1="360" y1="148" x2="360" y2="530" stroke-width="1.2" stroke-dasharray="4 4"/>
<line class="tx" x1="94" y1="178" x2="356" y2="178" stroke-width="2" marker-end="url(#ah)"/>
<text class="txt" x="225.0" y="172" font-size="12.5" font-weight="bold" text-anchor="middle" font-family="Menlo, Consolas, monospace">10</text>
<text class="muted" x="374" y="182" font-size="11.5">enter prog. mode</text>
<line class="rx" x1="356" y1="212" x2="94" y2="212" stroke-width="2" marker-end="url(#ah)"/>
<text class="rxt" x="225.0" y="206" font-size="12.5" font-weight="bold" text-anchor="middle" font-family="Menlo, Consolas, monospace">50</text>
<rect class="reset" x="290" y="236" width="140" height="26" rx="5" stroke-width="1.2"/>
<text class="resett" x="360" y="253" font-size="12" font-weight="bold" text-anchor="middle">radio resets</text>
<text class="muted" x="100" y="253" font-size="11.5">wait for it to boot</text>
<line class="tx" x1="94" y1="290" x2="356" y2="290" stroke-width="2" marker-end="url(#ah)"/>
<text class="txt" x="225.0" y="284" font-size="12.5" font-weight="bold" text-anchor="middle" font-family="Menlo, Consolas, monospace">23 01</text>
<text class="muted" x="374" y="294" font-size="11.5">ID query</text>
<line class="rx" x1="356" y1="324" x2="94" y2="324" stroke-width="2" marker-end="url(#ah)"/>
<text class="rxt" x="225.0" y="318" font-size="12.5" font-weight="bold" text-anchor="middle" font-family="Menlo, Consolas, monospace">50 · 8B 01 "807IYA0903"</text>
<line class="tx" x1="94" y1="364" x2="356" y2="364" stroke-width="2" marker-end="url(#ah)"/>
<text class="txt" x="225.0" y="358" font-size="12.5" font-weight="bold" text-anchor="middle" font-family="Menlo, Consolas, monospace">13</text>
<text class="muted" x="374" y="368" font-size="11.5">block size</text>
<line class="rx" x1="356" y1="398" x2="94" y2="398" stroke-width="2" marker-end="url(#ah)"/>
<text class="rxt" x="225.0" y="392" font-size="12.5" font-weight="bold" text-anchor="middle" font-family="Menlo, Consolas, monospace">50 · 82 00 20 00</text>
<line class="tx" x1="94" y1="438" x2="356" y2="438" stroke-width="2" marker-end="url(#ah)"/>
<text class="txt" x="225.0" y="432" font-size="12.5" font-weight="bold" text-anchor="middle" font-family="Menlo, Consolas, monospace">11 20 00 0D 80 …</text>
<text class="muted" x="374" y="442" font-size="11.5">× 20, to 0x0FE0</text>
<line class="rx" x1="356" y1="472" x2="94" y2="472" stroke-width="2" marker-end="url(#ah)"/>
<text class="rxt" x="225.0" y="466" font-size="12.5" font-weight="bold" text-anchor="middle" font-family="Menlo, Consolas, monospace">50 · 80 00 0D 80 + 32 B</text>
<text class="muted" x="374" y="476" font-size="11.5">640 B in all</text>
<text class="ink" x="700" y="104" font-size="16" font-weight="bold" text-anchor="middle">Write (after a full read)</text>
<rect class="host" x="515" y="116" width="100" height="32" rx="6" stroke-width="1.5"/>
<text class="txt" x="565" y="137" font-size="13" font-weight="bold" text-anchor="middle">Host / DPS</text>
<rect class="radio" x="785" y="116" width="100" height="32" rx="6" stroke-width="1.5"/>
<text class="ink" x="835" y="137" font-size="13" font-weight="bold" text-anchor="middle">GM600</text>
<line class="line" x1="565" y1="148" x2="565" y2="530" stroke-width="1.2" stroke-dasharray="4 4"/>
<line class="line" x1="835" y1="148" x2="835" y2="530" stroke-width="1.2" stroke-dasharray="4 4"/>
<line class="tx" x1="569" y1="178" x2="831" y2="178" stroke-width="2" marker-end="url(#ah)"/>
<text class="txt" x="700.0" y="172" font-size="12.5" font-weight="bold" text-anchor="middle" font-family="Menlo, Consolas, monospace">23 · 23 · 13</text>
<text class="muted" x="849" y="182" font-size="11.5">queries again</text>
<line class="rx" x1="831" y1="212" x2="569" y2="212" stroke-width="2" marker-end="url(#ah)"/>
<text class="rxt" x="700.0" y="206" font-size="12.5" font-weight="bold" text-anchor="middle" font-family="Menlo, Consolas, monospace">50 …</text>
<line class="wr" x1="569" y1="252" x2="831" y2="252" stroke-width="2" marker-end="url(#ah)"/>
<text class="wrt" x="700.0" y="246" font-size="12.5" font-weight="bold" text-anchor="middle" font-family="Menlo, Consolas, monospace">17 00 0E 13 + 32 B</text>
<text class="muted" x="849" y="256" font-size="11.5">× 15, to 0x0FD3</text>
<line class="rx" x1="831" y1="286" x2="569" y2="286" stroke-width="2" marker-end="url(#ah)"/>
<text class="rxt" x="700.0" y="280" font-size="12.5" font-weight="bold" text-anchor="middle" font-family="Menlo, Consolas, monospace">50 · 84</text>
<text class="muted" x="849" y="290" font-size="11.5">84 OK, 85 fail</text>
<line class="wr" x1="569" y1="326" x2="831" y2="326" stroke-width="2" marker-end="url(#ah)"/>
<text class="wrt" x="700.0" y="320" font-size="12.5" font-weight="bold" text-anchor="middle" font-family="Menlo, Consolas, monospace">17 00 0F F3 + 2 B</text>
<text class="muted" x="849" y="330" font-size="11.5">incl. checksum</text>
<line class="tx" x1="569" y1="360" x2="831" y2="360" stroke-width="2" marker-end="url(#ah)"/>
<text class="txt" x="700.0" y="354" font-size="12.5" font-weight="bold" text-anchor="middle" font-family="Menlo, Consolas, monospace">13</text>
<line class="wr" x1="569" y1="394" x2="831" y2="394" stroke-width="2" marker-end="url(#ah)"/>
<text class="wrt" x="700.0" y="388" font-size="12.5" font-weight="bold" text-anchor="middle" font-family="Menlo, Consolas, monospace">17 00 0F F5 + 7 B</text>
<text class="muted" x="849" y="398" font-size="11.5">factory field → FF</text>
<line class="tx" x1="569" y1="428" x2="831" y2="428" stroke-width="2" marker-end="url(#ah)"/>
<text class="txt" x="700.0" y="422" font-size="12.5" font-weight="bold" text-anchor="middle" font-family="Menlo, Consolas, monospace">10</text>
<text class="muted" x="849" y="432" font-size="11.5">restart</text>
<rect class="reset" x="765" y="446" width="140" height="26" rx="5" stroke-width="1.2"/>
<text class="resett" x="835" y="463" font-size="12" font-weight="bold" text-anchor="middle">radio resets</text>
</svg>
