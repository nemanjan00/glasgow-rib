<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 640" width="620" height="640" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>GM600 J0400 accessory connector pinout</title>
  <style>
    @media (prefers-color-scheme: dark) {
      text:not([fill]) { fill: #e6edf3; }
      [fill="#ffffff"] { fill: #0d1117; }
      [fill="#fafafa"] { fill: #161b22; }
      [fill="#e3e3e3"] { fill: #30363d; }
      [fill="#fde2df"] { fill: #3d1416; }
      [fill="#fff4d6"] { fill: #3b2e0a; }
      [fill="#e8f4ea"] { fill: #0f2a19; }
      [fill="#c0392b"] { fill: #ff7b72; }
      [fill="#2e7d32"] { fill: #3fb950; }
      [fill="#b9770e"] { fill: #d29922; }
      [fill="#555"] { fill: #9198a1; }
      [fill="#777"] { fill: #9198a1; }
      [stroke="#c0392b"] { stroke: #ff7b72; }
      [stroke="#2e7d32"] { stroke: #3fb950; }
      [stroke="#b9770e"] { stroke: #d29922; }
      [stroke="#333"] { stroke: #c9d1d9; }
      [stroke="#222"] { stroke: #c9d1d9; }
    }
  </style>
  <rect width="620" height="640" fill="#ffffff"/>
  <text x="310" y="34" text-anchor="middle" font-weight="bold" font-size="18">J0400 rear accessory connector (16 pin)</text>
  <text x="310" y="56" text-anchor="middle" font-size="12" fill="#555">Signal names from the GM600 UHF controller schematic, in pin-number order.</text>
  <text x="310" y="72" text-anchor="middle" font-size="12" fill="#555">This is not the physical layout: read the pin numbers moulded on the connector.</text>

  <g transform="translate(40,90)">
    <rect x="0" y="0" width="540" height="30" fill="#333"/>
    <text x="40" y="20" text-anchor="middle" fill="#fff" font-weight="bold">Pin</text>
    <text x="100" y="20" fill="#fff" font-weight="bold">Signal</text>
    <text x="330" y="20" fill="#fff" font-weight="bold">For the RIB</text>

    <rect x="0" y="30"  width="540" height="30" fill="#fafafa"/>
    <text x="40" y="50" text-anchor="middle">1</text><text x="100" y="50">EXT_SPKR−</text>
    <rect x="0" y="60"  width="540" height="30" fill="#ffffff"/>
    <text x="40" y="80" text-anchor="middle">2</text><text x="100" y="80">EXTERNAL_MIC_AUDIO</text>
    <rect x="0" y="90"  width="540" height="30" fill="#fafafa"/>
    <text x="40" y="110" text-anchor="middle">3</text><text x="100" y="110">EXTERNAL_PTT</text>
    <rect x="0" y="120" width="540" height="30" fill="#ffffff"/>
    <text x="40" y="140" text-anchor="middle">4</text><text x="100" y="140">EXTERNAL_ALARM</text>
    <rect x="0" y="150" width="540" height="30" fill="#fafafa"/>
    <text x="40" y="170" text-anchor="middle">5</text><text x="100" y="170">FLAT_TX_AUDIO</text>

    <rect x="0" y="180" width="540" height="30" fill="#fde2df" stroke="#c0392b" stroke-width="2"/>
    <text x="40" y="200" text-anchor="middle" font-weight="bold" fill="#c0392b">6</text>
    <text x="100" y="200" font-weight="bold" fill="#c0392b">SCI_DATA_IN → BUS+</text>
    <text x="330" y="200" font-weight="bold" fill="#c0392b">Glasgow A0 (BUS)</text>

    <rect x="0" y="210" width="540" height="30" fill="#e3e3e3" stroke="#222" stroke-width="2"/>
    <text x="40" y="230" text-anchor="middle" font-weight="bold">7</text>
    <text x="100" y="230" font-weight="bold">GROUND</text>
    <text x="330" y="230" font-weight="bold">Glasgow GND</text>

    <rect x="0" y="240" width="540" height="30" fill="#fafafa"/>
    <text x="40" y="260" text-anchor="middle">8</text><text x="100" y="260">SCI_DATA_OUT</text>
    <text x="330" y="260" fill="#777">leave open (Q0421 not fitted)</text>
    <rect x="0" y="270" width="540" height="30" fill="#ffffff"/>
    <text x="40" y="290" text-anchor="middle">9</text><text x="100" y="290">EMERGENCY_SWITCH</text>
    <rect x="0" y="300" width="540" height="30" fill="#fafafa"/>
    <text x="40" y="320" text-anchor="middle">10</text><text x="100" y="320">IGNITION</text>
    <rect x="0" y="330" width="540" height="30" fill="#ffffff"/>
    <text x="40" y="350" text-anchor="middle">11</text><text x="100" y="350">FLAT_RX_AUDIO</text>
    <rect x="0" y="360" width="540" height="30" fill="#fafafa"/>
    <text x="40" y="380" text-anchor="middle">12</text><text x="100" y="380">GPI/O</text>

    <rect x="0" y="390" width="540" height="30" fill="#fff4d6" stroke="#b9770e" stroke-width="2"/>
    <text x="40" y="410" text-anchor="middle" font-weight="bold" fill="#b9770e">13</text>
    <text x="100" y="410" font-weight="bold" fill="#b9770e">ANALOG_GND / SW_B+</text>
    <text x="330" y="410" font-weight="bold" fill="#b9770e">NOT ground: may carry B+</text>

    <rect x="0" y="420" width="540" height="30" fill="#e8f4ea" stroke="#2e7d32" stroke-width="2"/>
    <text x="40" y="440" text-anchor="middle" font-weight="bold" fill="#2e7d32">14</text>
    <text x="100" y="440" font-weight="bold" fill="#2e7d32">HOOK_RSS</text>
    <text x="330" y="440" font-weight="bold" fill="#2e7d32">9 V lab PSU, NOT Glasgow</text>
    <rect x="0" y="450" width="540" height="30" fill="#fafafa"/>
    <text x="40" y="470" text-anchor="middle">15</text><text x="100" y="470">RSSI</text>
    <rect x="0" y="480" width="540" height="30" fill="#ffffff"/>
    <text x="40" y="500" text-anchor="middle">16</text><text x="100" y="500">EXT_SPKR+</text>
    <rect x="0" y="0" width="540" height="510" fill="none" stroke="#333"/>
  </g>
</svg>
