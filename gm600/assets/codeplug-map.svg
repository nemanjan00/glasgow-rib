<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Helvetica, Arial, sans-serif">
<title>GM600 codeplug: the 640-byte EEPROM at 0x0D80-0x0FFF, by block and decode status</title>
<style>
  .bg { fill: #ffffff; stroke: #d0d7de; }
  .ink { fill: #1f2328; }
  .muted { fill: #59636e; }
  .line { stroke: #8c959f; fill: none; }
  .bound { fill: #2da44e; }
  .partial { fill: #d4a72c; }
  .readonly { fill: #6e7781; }
  .unknown { fill: #d0d7de; }
  .factory { fill: #cf222e; }
  .cks { fill: #8250df; }
  .host { fill: #ddf4ff; stroke: #0969da; }
  .radio { fill: #f6f8fa; stroke: #6e7781; }
  .tx { stroke: #0969da; }
  .txt { fill: #0969da; }
  .rx { stroke: #1a7f37; }
  .rxt { fill: #1a7f37; }
  .reset { fill: #fff8c5; stroke: #9a6700; }
  .resett { fill: #9a6700; }
  .wr { stroke: #cf222e; }
  .wrt { fill: #cf222e; }
  .sep { stroke: #ffffff; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; stroke: #30363d; }
    .ink { fill: #e6edf3; }
    .muted { fill: #9198a1; }
    .line { stroke: #6e7681; }
    .bound { fill: #3fb950; }
    .partial { fill: #d29922; }
    .readonly { fill: #8b949e; }
    .unknown { fill: #30363d; }
    .factory { fill: #f85149; }
    .cks { fill: #a371f7; }
    .host { fill: #0c2d4a; stroke: #58a6ff; }
    .radio { fill: #161b22; stroke: #8b949e; }
    .tx { stroke: #58a6ff; }
    .txt { fill: #58a6ff; }
    .rx { stroke: #3fb950; }
    .rxt { fill: #3fb950; }
    .reset { fill: #3b2e0a; stroke: #d29922; }
    .resett { fill: #d29922; }
    .wr { stroke: #ff7b72; }
    .wrt { fill: #ff7b72; }
    .sep { stroke: #0d1117; }
  }
</style>
<rect class="bg" x="0.5" y="0.5" width="999" height="519" rx="16"/>
<text class="ink" x="40" y="44" font-size="20" font-weight="bold">The GM600 codeplug: 640 bytes of CPU EEPROM</text>
<text class="muted" x="40" y="68" font-size="13.5">Radio addresses 0x0D80–0x0FFF, read as 20 × 32-byte blocks. Width is to scale.</text>
<path class="line" d="M 251.3 128 L 251.3 120 L 954.2 120 L 954.2 128" stroke-width="1.5"/>
<text class="muted" x="602.8" y="113" font-size="12" text-anchor="middle">DPS writes 0x0E13–0x0FFB</text>
<path class="line" d="M 40 128 L 40 120 L 247.3 120 L 247.3 128" stroke-width="1.5"/>
<text class="muted" x="145.7" y="113" font-size="12" text-anchor="middle">never written</text>
<rect class="readonly" x="40.0" y="150" width="211.3" height="54"/>
<text x="145.7" y="174" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#ffffff">Radio / alignment</text>
<text x="145.7" y="192" font-size="11.5" text-anchor="middle" fill="#ffffff" opacity="0.9">serial, softpot, band grid</text>
<rect class="partial" x="251.3" y="150" width="352.2" height="54"/>
<line class="sep" x1="251.3" y1="150" x2="251.3" y2="204" stroke-width="1.5"/>
<text x="427.4" y="174" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#ffffff">Network (MPT1327)</text>
<text x="427.4" y="192" font-size="11.5" text-anchor="middle" fill="#ffffff" opacity="0.9">fields enumerated, few bound</text>
<rect class="bound" x="603.5" y="150" width="50.3" height="54"/>
<line class="sep" x1="603.5" y1="150" x2="603.5" y2="204" stroke-width="1.5"/>
<line class="line" x1="628.7" y1="204" x2="618.7" y2="286" stroke-width="1.2"/>
<text class="ink" x="618.7" y="300" font-size="12.5" font-weight="bold" text-anchor="middle">MPT config</text>
<text class="muted" x="618.7" y="315" font-size="11" text-anchor="middle">own unit no., timers, power</text>
<rect class="bound" x="653.8" y="150" width="86.2" height="54"/>
<line class="sep" x1="653.8" y1="150" x2="653.8" y2="204" stroke-width="1.5"/>
<line class="line" x1="696.9" y1="204" x2="696.9" y2="226" stroke-width="1.2"/>
<text class="ink" x="696.9" y="240" font-size="12.5" font-weight="bold" text-anchor="middle">Own groups</text>
<text class="muted" x="696.9" y="255" font-size="11" text-anchor="middle">15 × 4 B</text>
<rect class="bound" x="740.1" y="150" width="40.2" height="54"/>
<line class="sep" x1="740.1" y1="150" x2="740.1" y2="204" stroke-width="1.5"/>
<line class="line" x1="760.2" y1="204" x2="760.2" y2="286" stroke-width="1.2"/>
<text class="ink" x="760.2" y="300" font-size="12.5" font-weight="bold" text-anchor="middle">Channels</text>
<text class="muted" x="760.2" y="315" font-size="11" text-anchor="middle">4 × 7 B</text>
<rect class="bound" x="780.3" y="150" width="33.1" height="54"/>
<line class="sep" x1="780.3" y1="150" x2="780.3" y2="204" stroke-width="1.5"/>
<line class="line" x1="796.8" y1="204" x2="796.8" y2="226" stroke-width="1.2"/>
<text class="ink" x="796.8" y="240" font-size="12.5" font-weight="bold" text-anchor="middle">Shortform</text>
<text class="muted" x="796.8" y="255" font-size="11" text-anchor="middle">BCD dial strings</text>
<rect class="unknown" x="813.4" y="150" width="129.4" height="54"/>
<line class="sep" x1="813.4" y1="150" x2="813.4" y2="204" stroke-width="1.5"/>
<text class="ink" x="878.1" y="181" font-size="12.5" font-weight="bold" text-anchor="middle">undecoded</text>
<rect class="cks" x="942.8" y="150" width="2.5" height="54"/>
<line class="sep" x1="942.8" y1="150" x2="942.8" y2="204" stroke-width="1.5"/>
<line class="line" x1="944.0" y1="204" x2="944.0" y2="226" stroke-width="1.2"/>
<text class="ink" x="944.0" y="240" font-size="12.5" font-weight="bold" text-anchor="middle">Checksum</text>
<text class="muted" x="944.0" y="255" font-size="11" text-anchor="middle">0x0FF4</text>
<rect class="factory" x="944.2" y="150" width="10.1" height="54"/>
<line class="sep" x1="944.2" y1="150" x2="944.2" y2="204" stroke-width="1.5"/>
<line class="line" x1="949.2" y1="204" x2="909.2" y2="286" stroke-width="1.2"/>
<text class="ink" x="909.2" y="300" font-size="12.5" font-weight="bold" text-anchor="middle">Factory field</text>
<text class="muted" x="909.2" y="315" font-size="11" text-anchor="middle">DPS blanks it</text>
<rect class="unknown" x="954.2" y="150" width="5.8" height="54"/>
<line class="sep" x1="954.2" y1="150" x2="954.2" y2="204" stroke-width="1.5"/>
<text class="muted" x="40.0" y="144" font-size="10.5" text-anchor="start" font-family="Menlo, Consolas, monospace">0x0D80</text>
<text class="muted" x="251.3" y="144" font-size="10.5" text-anchor="middle" font-family="Menlo, Consolas, monospace">0x0E13</text>
<text class="muted" x="603.5" y="144" font-size="10.5" text-anchor="middle" font-family="Menlo, Consolas, monospace">0x0F08</text>
<text class="muted" x="960.0" y="144" font-size="10.5" text-anchor="end" font-family="Menlo, Consolas, monospace">0x0FFF</text>
<text class="ink" x="40" y="350" font-size="14" font-weight="bold">One channel record (7 bytes, 4 of them from 0x0F67)</text>
<rect class="bound" x="40" y="364" width="180" height="44" rx="4"/>
<text x="130.0" y="384" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Rx freq</text>
<text x="130.0" y="400" font-size="11" text-anchor="middle" fill="#ffffff" opacity="0.9">BE16</text>
<rect class="bound" x="224" y="364" width="180" height="44" rx="4"/>
<text x="314.0" y="384" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Tx freq</text>
<text x="314.0" y="400" font-size="11" text-anchor="middle" fill="#ffffff" opacity="0.9">BE16</text>
<rect class="bound" x="408" y="364" width="88" height="44" rx="4"/>
<text x="452.0" y="384" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Tx PL</text>
<text x="452.0" y="400" font-size="11" text-anchor="middle" fill="#ffffff" opacity="0.9">index</text>
<rect class="bound" x="500" y="364" width="88" height="44" rx="4"/>
<text x="544.0" y="384" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Rx PL</text>
<text x="544.0" y="400" font-size="11" text-anchor="middle" fill="#ffffff" opacity="0.9">index</text>
<rect class="bound" x="592" y="364" width="88" height="44" rx="4"/>
<text x="636.0" y="384" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Options</text>
<text x="636.0" y="400" font-size="11" text-anchor="middle" fill="#ffffff" opacity="0.9">bits</text>
<text class="muted" x="40" y="430" font-size="12">Frequency words: f = 375 MHz + (v &amp; 0x7FFF) × (bit 15 ? 6.25 : 5 kHz).   Options: bit 0 Data · bits 2:1 Tx inhibit · bit 3 Power · bit 4 Monitor</text>
<rect class="bound" x="40" y="479" width="14" height="14" rx="3"/>
<text class="muted" x="60" y="490" font-size="12">decoded and bound</text>
<rect class="partial" x="194.2" y="479" width="14" height="14" rx="3"/>
<text class="muted" x="214.2" y="490" font-size="12">enumerated, partly bound</text>
<rect class="readonly" x="394.59999999999997" y="479" width="14" height="14" rx="3"/>
<text class="muted" x="414.59999999999997" y="490" font-size="12">factory, read-only</text>
<rect class="unknown" x="555.4" y="479" width="14" height="14" rx="3"/>
<text class="muted" x="575.4" y="490" font-size="12">not decoded</text>
<rect class="cks" x="670.0" y="479" width="14" height="14" rx="3"/>
<text class="muted" x="690.0" y="490" font-size="12">checksum</text>
<rect class="factory" x="764.8" y="479" width="14" height="14" rx="3"/>
<text class="muted" x="784.8" y="490" font-size="12">factory field</text>
</svg>
