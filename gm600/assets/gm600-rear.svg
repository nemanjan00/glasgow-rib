<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>GM600 rear view with RIB hookup (illustrative)</title>
  <style>
    @media (prefers-color-scheme: dark) {
      text:not([fill]) { fill: #e6edf3; }
    [stroke="#1a1a1a"] { stroke: #6e7681; }
      [fill="#ffffff"] { fill: #0d1117; }
      [fill="#e8f4ea"] { fill: #0f2a19; }
      [fill="#eef3fb"] { fill: #10223f; }
      [fill="#c0392b"] { fill: #ff7b72; }
      [fill="#2e7d32"] { fill: #3fb950; }
      [fill="#b9770e"] { fill: #d29922; }
      [fill="#2a4d8f"] { fill: #8fb5ef; }
      [fill="#555"] { fill: #9198a1; }
      [fill="#777"] { fill: #9198a1; }
      [stroke="#c0392b"] { stroke: #ff7b72; }
      [stroke="#2e7d32"] { stroke: #3fb950; }
      [stroke="#2a4d8f"] { stroke: #6c9ce6; }
      [stroke="#222"] { stroke: #c9d1d9; }
    }
  </style>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-weight="bold" font-size="18">GM600: where to plug in (rear view, illustrative)</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#777">Proportions and connector positions are approximate; check against your radio.</text>

  <!-- chassis with heatsink fins -->
  <rect x="80" y="90" width="540" height="200" rx="14" fill="#3b3b3b" stroke="#111" stroke-width="2"/>
  <g stroke="#555" stroke-width="6">
    <line x1="110" y1="104" x2="110" y2="276"/><line x1="135" y1="104" x2="135" y2="276"/>
    <line x1="160" y1="104" x2="160" y2="276"/><line x1="185" y1="104" x2="185" y2="276"/>
    <line x1="210" y1="104" x2="210" y2="276"/><line x1="235" y1="104" x2="235" y2="276"/>
  </g>

  <!-- antenna connector -->
  <circle cx="320" cy="190" r="26" fill="#c9a227" stroke="#111" stroke-width="2"/>
  <circle cx="320" cy="190" r="8" fill="#3b3b3b"/>
  <text x="320" y="250" text-anchor="middle" fill="#eee" font-size="12">antenna</text>

  <!-- power lead -->
  <rect x="390" y="172" width="40" height="36" rx="4" fill="#222" stroke="#111"/>
  <path d="M410 208 C 410 330, 300 330, 260 420" fill="none" stroke="#c0392b" stroke-width="5"/>
  <path d="M418 208 C 418 330, 320 340, 280 420" fill="none" stroke="#1a1a1a" stroke-width="5"/>
  <text x="248" y="440" text-anchor="middle" font-size="12">13.8 V DC power lead</text>
  <text x="410" y="162" text-anchor="middle" fill="#eee" font-size="12">power</text>

  <!-- accessory connector J0400 -->
  <rect x="480" y="160" width="110" height="60" rx="6" fill="#111" stroke="#c0392b" stroke-width="3"/>
  <g fill="#c9a227">
    <circle cx="496" cy="178" r="4"/><circle cx="507" cy="178" r="4"/><circle cx="518" cy="178" r="4"/><circle cx="529" cy="178" r="4"/>
    <circle cx="540" cy="178" r="4"/><circle cx="551" cy="178" r="4"/><circle cx="562" cy="178" r="4"/><circle cx="573" cy="178" r="4"/>
    <circle cx="496" cy="202" r="4"/><circle cx="507" cy="202" r="4"/><circle cx="518" cy="202" r="4"/><circle cx="529" cy="202" r="4"/>
    <circle cx="540" cy="202" r="4"/><circle cx="551" cy="202" r="4"/><circle cx="562" cy="202" r="4"/><circle cx="573" cy="202" r="4"/>
  </g>
  <text x="535" y="245" text-anchor="middle" fill="#ff8a7a" font-weight="bold">J0400</text>
  <text x="535" y="262" text-anchor="middle" fill="#eee" font-size="11">accessory, 16 pin</text>

  <!-- leads to Glasgow -->
  <path d="M560 160 C 600 110, 680 120, 720 150" fill="none" stroke="#c0392b" stroke-width="3"/>
  <path d="M572 220 C 610 260, 690 240, 720 210" fill="none" stroke="#222" stroke-width="3"/>
  <text x="650" y="108" text-anchor="middle" fill="#c0392b" font-weight="bold">pin 6: BUS+</text>
  <text x="665" y="272" text-anchor="middle" font-weight="bold">pin 7: GND</text>

  <!-- HOOK supply -->
  <path d="M584 214 C 600 260, 560 290, 560 330" fill="none" stroke="#2e7d32" stroke-width="3"/>
  <rect x="470" y="330" width="180" height="50" rx="6" fill="#e8f4ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="560" y="351" text-anchor="middle" font-weight="bold" fill="#2e7d32">Lab PSU 9 V, ~20 mA limit</text>
  <text x="560" y="369" text-anchor="middle" font-size="12">+ → pin 14 (HOOK), − → pin 7</text>
  <text x="640" y="310" text-anchor="start" fill="#2e7d32" font-weight="bold">pin 14: HOOK</text>

  <rect x="720" y="120" width="150" height="110" rx="10" fill="#eef3fb" stroke="#2a4d8f" stroke-width="2"/>
  <text x="795" y="148" text-anchor="middle" font-weight="bold" font-size="16" fill="#2a4d8f">Glasgow</text>
  <text x="795" y="170" text-anchor="middle" font-size="12">A0 ← pin 6</text>
  <text x="795" y="188" text-anchor="middle" font-size="12">GND ← pin 7</text>
  <text x="795" y="210" text-anchor="middle" font-size="12">VIO = 5 V</text>
  <path d="M795 230 L 795 300" stroke="#2a4d8f" stroke-width="3"/>
  <rect x="740" y="300" width="110" height="40" rx="6" fill="#ffffff" stroke="#2a4d8f"/>
  <text x="795" y="325" text-anchor="middle" font-size="12">USB to PC</text>

  <!-- front reminder -->
  <text x="600" y="420" text-anchor="middle" font-size="12" fill="#555">Alternative: control head connector J0101, pin 15 = BUS+, pin 7 = GND, pin 3 = HOOK</text>
  <text x="600" y="440" text-anchor="middle" font-size="12" fill="#b9770e">Never connect HOOK to Glasgow: its I/O tolerates about 5.5 V.</text>
</svg>
